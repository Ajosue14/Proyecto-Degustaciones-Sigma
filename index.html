<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Plan de Rutas de Reparto</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <!-- Fuente moderna -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: 'Inter', Arial, sans-serif;
      color: #1f2933;
    }

    #map {
      height: 100vh;
      width: 100vw;
    }

    /* PANEL */
    .filters {
      position: absolute;
      top: 16px;
      left: 16px;
      background: white;
      padding: 16px;
      border-radius: 12px;
      width: 260px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      z-index: 1000;
    }

    .filters h3 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }

    .filters p {
      margin: 4px 0 14px;
      font-size: 13px;
      color: #6b7280;
    }

    .filters label {
      font-size: 12px;
      font-weight: 600;
      margin-top: 6px;
      display: block;
    }

    .filters select {
      width: 100%;
      padding: 8px;
      margin-top: 4px;
      font-size: 13px;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      background: #f9fafb;
    }

    .counter {
      margin-top: 12px;
      padding: 10px;
      background: #f3f4f6;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
    }

    .legend {
      margin-top: 10px;
      font-size: 12px;
      color: #374151;
    }

    .legend span {
      display: block;
      margin-top: 4px;
    }
  </style>
</head>

<body>

  <!-- PANEL -->
  <div class="filters">
    <h3>Plan de Reparto</h3>
    <p>Visualiza rutas por día y camión</p>

    <label>Día</label>
    <select id="dayFilter">
      <option value="LUNES">Lunes</option>
      <option value="MARTES">Martes</option>
      <option value="MIERCOLES">Miércoles</option>
      <option value="JUEVES">Jueves</option>
      <option value="VIERNES">Viernes</option>
      <option value="SABADO">Sábado</option>
    </select>

    <label>Camión</label>
    <select id="truckFilter">
      <option value="TODOS">Todos los camiones</option>
      <option value="F8X-899">F8X-899</option>
      <option value="F1G-866">F1G-866</option>
    </select>

    <div id="count" class="counter">Tiendas en ruta: 0</div>

    <div class="legend">
      <span>🔵 F8X‑899 – Sur / Centro</span>
      <span>🟢 F1G‑866 – Norte / Este</span>
    </div>
  </div>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <!-- DATA -->
  <script src="data.js"></script>

  <script>
    const map = L.map("map").setView([-12.06, -77.04], 11);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "© OpenStreetMap"
    }).addTo(map);

    let markers = [];

    /* PINES DISCRETOS TIPO GOOGLE MAPS */
    function getIcon(camion) {
      const color = camion === "F1G-866" ? "#2fa36b" : "#1f4fd8";

      const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="30" viewBox="0 0 22 30">
          <path d="M11 0C4.9 0 0 4.9 0 11c0 8.5 11 19 11 19s11-10.5 11-19C22 4.9 17.1 0 11 0z"
                fill="${color}"/>
          <circle cx="11" cy="11" r="4" fill="white"/>
        </svg>
      `;

      return L.divIcon({
        html: svg,
        className: "",
        iconSize: [22, 30],
        iconAnchor: [11, 30],
        popupAnchor: [0, -22]
      });
    }

    function renderMarkers() {
      markers.forEach(m => map.removeLayer(m));
      markers = [];

      const day = dayFilter.value;
      const truck = truckFilter.value;

      const filtered = stores.filter(s =>
        s.dia === day && (truck === "TODOS" || s.camion === truck)
      );

      filtered.forEach(store => {
        const marker = L.marker([store.lat, store.lng], {
          icon: getIcon(store.camion)
        })
        .addTo(map)
        .bindPopup(`
          <strong>${store.nombre}</strong><br>
          <hr>
          <b>Códigos:</b> ${store.codigos}<br>
          <b>Camión:</b> ${store.camion}<br>
          <b>Día:</b> ${store.dia}
        `);

        markers.push(marker);
      });

      count.innerText = `Tiendas en ruta: ${markers.length}`;
    }

    dayFilter.addEventListener("change", renderMarkers);
    truckFilter.addEventListener("change", renderMarkers);

    renderMarkers();
  </script>

</body>
</html>
