<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Rutas y Frecuencias de Reparto</title>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet/dist/leaflet.css"
  />

  <style>
    html, body {
      height: 100%;
      margin: 0;
    }

    /* MAPA FULLSCREEN */
    #map {
      height: 100vh;
      width: 100vw;
    }

    /* PANEL DE FILTROS */
    .filters {
      position: absolute;
      top: 15px;
      left: 15px;
      background: white;
      padding: 12px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      z-index: 1000;
      font-family: Arial, sans-serif;
      width: 200px;
    }

    .filters h4 {
      margin: 0 0 8px 0;
      font-size: 14px;
    }

    .filters select {
      width: 100%;
      margin-bottom: 10px;
      padding: 6px;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <!-- FILTROS -->
  <div class="filters">
    <h4>Día</h4>
    <select id="dayFilter">
      <option value="Lunes">Lunes</option>
      <option value="Martes">Martes</option>
      <option value="Miércoles">Miércoles</option>
      <option value="Jueves">Jueves</option>
      <option value="Viernes">Viernes</option>
      <option value="Sábado">Sábado</option>
    </select>

    <h4>Camión</h4>
    <select id="truckFilter">
      <option value="F8X-899">F8X-899</option>
      <option value="F1G-866">F1G-866</option>
    </select>
  </div>

  <!-- MAPA -->
  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="data.js"></script>
  <script>
    // inicializar mapa
const map = L.map('map').setView([-12.06, -77.04], 11);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap'
}).addTo(map);

let markers = [];

function renderMarkers() {
  markers.forEach(m => map.removeLayer(m));
  markers = [];

  const day = document.getElementById('dayFilter').value;
  const truck = document.getElementById('truckFilter').value;

  stores
    .filter(s => s.dia === day && s.camion === truck)
    .forEach(store => {
      const marker = L.marker([store.lat, store.lng])
        .addTo(map)
        .bindPopup(`
          <strong>${store.nombre}</strong><br>
          Códigos: ${store.codigos}<br>
          Camión: ${store.camion}<br>
          Día: ${store.dia}
        `);

      markers.push(marker);
    });
}

// eventos
document.getElementById('dayFilter').addEventListener('change', renderMarkers);
document.getElementById('truckFilter').addEventListener('change', renderMarkers);

// pintar al cargar
renderMarkers();
  </script>

</body>
</html>
